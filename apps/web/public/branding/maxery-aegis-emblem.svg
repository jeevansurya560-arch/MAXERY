<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clinical Elegance Muted Gold Gradient -->
    <linearGradient id="mutedGoldGrad" x1="12" y1="4" x2="60" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4BC8B"/>
      <stop offset="45%" stop-color="#BFA06A"/>
      <stop offset="100%" stop-color="#8C7043"/>
    </linearGradient>

    <!-- Clinical Navy to Near Black Ground -->
    <linearGradient id="clinicalNavyGround" x1="16" y1="6" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3854"/>
      <stop offset="50%" stop-color="#172B40"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>

    <!-- Warm Ivory Cross Gradient -->
    <linearGradient id="warmIvoryGrad" x1="24" y1="22" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F1EA"/>
    </linearGradient>
  </defs>

  <!-- Outer Heraldic Shield Facet (Muted Gold Chiseled Rim) -->
  <path d="M36 4L60 14V34C60 51 50 61.5 36 67C22 61.5 12 51 12 34V14L36 4Z" 
        fill="url(#mutedGoldGrad)"/>

  <!-- Inner Recessed Clinical Navy Ground -->
  <path d="M36 7.5L56.5 16V33.5C56.5 48.5 47.5 58 36 63C24.5 58 15.5 48.5 15.5 33.5V16L36 7.5Z" 
        fill="url(#clinicalNavyGround)"/>

  <!-- Guilloche Filigree Filaments (Muted Gold Tracing) -->
  <path d="M36 12L52 19V32C52 44 45 52 36 56.5C27 52 20 44 20 32V19L36 12Z" 
        stroke="url(#mutedGoldGrad)" 
        stroke-width="1" 
        stroke-dasharray="2 3"
        fill="none" 
        opacity="0.45"/>

  <!-- Sovereign Cross of Life & Clinical Beacon -->
  <g>
    <!-- Vertical Scepter -->
    <rect x="33" y="21" width="6" height="28" rx="2" fill="url(#warmIvoryGrad)"/>
    <!-- Horizontal Crossbar -->
    <rect x="22" y="32" width="28" height="6" rx="2" fill="url(#warmIvoryGrad)"/>
    <!-- Muted Gold Core Diamond -->
    <polygon points="36,30 41,35 36,40 31,35" fill="url(#mutedGoldGrad)"/>
    <circle cx="36" cy="35" r="2" fill="#0E0E0E"/>
  </g>
</svg>
